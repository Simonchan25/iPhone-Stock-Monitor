name: macOS build and offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./scripts/build.sh
      - name: Run offline self-tests
        run: ./scripts/test.sh
